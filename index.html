<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Здравен Мениджър</title>
  <style>
    :root {
      --primary: #2b6cb0;
      --primary-hover: #2c5282;
      --bg-color: #f7fafc;
      --card-bg: #ffffff;
      --text-color: #2d3748;
      --border-color: #e2e8f0;
      --danger: #e53e3e;
      --success: #38a169;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 16px;
      line-height: 1.5;
      padding: 10px;
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      background: var(--primary);
      color: white;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 12px;
      font-weight: bold;
      font-size: 1.2rem;
    }

    nav {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    nav button {
      flex: 1;
      min-width: 90px;
      padding: 10px 6px;
      background: #edf2f7;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }

    nav button.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .tab-content {
      display: none;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 12px;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1rem;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* Autocomplete Styling */
    .autocomplete-suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 0 0 6px 6px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .suggestion-item {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover, .suggestion-item.selected {
      background-color: #ebf8ff;
      color: var(--primary);
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      text-align: center;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 0.85rem;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #edf2f7;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge-danger { background: #fed7d7; color: #9b2c2c; }
    .badge-success { background: #c6f6d5; color: #22543d; }

    /* SVG Chart */
    .chart-container {
      width: 100%;
      height: 180px;
      margin-top: 12px;
    }

    svg {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <header>Здравен Мениджър</header>

  <nav>
    <button class="nav-btn active" onclick="switchTab('purchases')">Покупки</button>
    <button class="nav-btn" onclick="switchTab('medications')">Лекарства</button>
    <button class="nav-btn" onclick="switchTab('labs')">Лаборатория</button>
    <button class="nav-btn" onclick="switchTab('shopping')">Пазар</button>
    <button class="nav-btn" onclick="switchTab('calculator')">ЗОК</button>
  </nav>

  <!-- Покупки -->
  <section id="tab-purchases" class="tab-content active">
    <h3>Регистриране на покупка</h3>
    <form id="purchase-form" onsubmit="handlePurchaseSubmit(event)">
      <div class="form-group">
        <label for="med-search">Лекарство (на кирилица или латиница):</label>
        <input type="text" id="med-search" class="form-control" autocomplete="off" placeholder="Въведете букви..." required>
        <input type="hidden" id="selected-medication-id" name="medication_id" required>
        <div id="med-suggestions" class="autocomplete-suggestions"></div>
      </div>

      <div class="form-group">
        <label for="pharmacy-id">Аптека:</label>
        <select id="pharmacy-id" class="form-control">
          <option value="">-- Изберете аптека --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="purchase-date">Дата на закупуване:</label>
        <input type="date" id="purchase-date" class="form-control" required>
      </div>

      <div class="form-group">
        <label for="price-eur">Цена (EUR):</label>
        <input type="number" step="0.01" id="price-eur" class="form-control" required>
      </div>

      <div class="form-group">
        <label for="price-zk-eur">Реимбурсирана цена от ЗОК (EUR):</label>
        <input type="number" step="0.01" id="price-zk-eur" class="form-control">
      </div>

      <div class="form-group">
        <label for="purchase-notes">Бележки:</label>
        <input type="text" id="purchase-notes" class="form-control">
      </div>

      <button type="submit" class="btn">Запиши покупка</button>
    </form>

    <h4 style="margin-top: 16px;">Последни покупки</h4>
    <table>
      <thead>
        <tr>
          <th>Лекарство</th>
          <th>Дата</th>
          <th>Цена</th>
          <th>ЗОК</th>
        </tr>
      </thead>
      <tbody id="purchases-list"></tbody>
    </table>
  </section>

  <!-- Медикаменти -->
  <section id="tab-medications" class="tab-content">
    <h3>Списък с медикаменти</h3>
    <table>
      <thead>
        <tr>
          <th>БГ Име</th>
          <th>Латинско</th>
          <th>Доза</th>
          <th>Статус</th>
        </tr>
      </thead>
      <tbody id="medications-table-body"></tbody>
    </table>
  </section>

  <!-- Лаборатория -->
  <section id="tab-labs" class="tab-content">
    <h3>Лабораторни резултати</h3>
    <div class="chart-container">
      <svg id="trend-chart" viewBox="0 0 300 150">
        <path id="chart-path" d="" fill="none" stroke="#2b6cb0" stroke-width="3"/>
      </svg>
    </div>
    <table>
      <thead>
        <tr>
          <th>Параметър</th>
          <th>Стойност</th>
          <th>Норма</th>
        </tr>
      </thead>
      <tbody id="lab-results-body"></tbody>
    </table>
  </section>

  <!-- Списък за пазаруване -->
  <section id="tab-shopping" class="tab-content">
    <h3>Списък за пазаруване</h3>
    <form id="shopping-form" onsubmit="handleShoppingSubmit(event)">
      <div class="form-group">
        <input type="text" id="shop-med-name" class="form-control" placeholder="Име на лекарство" required>
      </div>
      <div class="form-group">
        <input type="number" id="shop-qty" class="form-control" value="1" min="1" required>
      </div>
      <button type="submit" class="btn">Добави в списъка</button>
    </form>
    <ul id="shopping-list-container" style="margin-top: 12px; list-style: none;"></ul>
  </section>

  <!-- ЗОК Калкулатор -->
  <section id="tab-calculator" class="tab-content">
    <h3>ЗОК Калкулатор</h3>
    <p>Изчисление на разликата в реимбурсацията за текущия месец.</p>
    <div id="calc-summary" style="margin-top: 12px; font-weight: bold;"></div>
  </section>

  <script>
    const SUPABASE_URL = "https://your-supabase-url.supabase.co";
    const SUPABASE_KEY = "your-anon-key";

    let medicationsList = [];
    let pharmaciesList = [];

    // Превключване на табове
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');
      event.target.classList.add('active');
    }

    // Зареждане на началните данни
    async function initData() {
      document.getElementById('purchase-date').valueAsDate = new Date();
      await fetchMedications();
      await fetchPharmacies();
      await fetchPurchases();
      setupAutocomplete();
    }

    // Заявка за лекарства
    async function fetchMedications() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/medications?select=id,name_bg,name_latin,dosage,is_active`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        medicationsList = await response.json();
        renderMedicationsTable();
      } catch (err) {
        console.error("Грешка при зареждане на медикаменти:", err);
      }
    }

    // Рендериране на таблицата с лекарства
    function renderMedicationsTable() {
      const tbody = document.getElementById('medications-table-body');
      tbody.innerHTML = medicationsList.map(m => `
        <tr>
          <td>${m.name_bg}</td>
          <td>${m.name_latin || '-'}</td>
          <td>${m.dosage || '-'}</td>
          <td><span class="badge ${m.is_active ? 'badge-success' : 'badge-danger'}">${m.is_active ? 'Активно' : 'Неактивно'}</span></td>
        </tr>
      `).join('');
    }

    // Зареждане на аптеки
    async function fetchPharmacies() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/pharmacies?select=id,name`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        pharmaciesList = await response.json();
        const select = document.getElementById('pharmacy-id');
        select.innerHTML = '<option value="">-- Изберете аптека --</option>' +
          pharmaciesList.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      } catch (err) {
        console.error("Грешка при зареждане на аптеки:", err);
      }
    }

    // Настройка на Търсене с автодопълване (BG / EN с startsWith)
    function setupAutocomplete() {
      const input = document.getElementById('med-search');
      const hiddenInput = document.getElementById('selected-medication-id');
      const suggestions = document.getElementById('med-suggestions');

      input.addEventListener('input', function() {
        const query = this.value.trim().toLowerCase();
        suggestions.innerHTML = '';
        hiddenInput.value = '';

        if (query.length === 0) return;

        // Намиране на съвпадения започващи с въведените букви на БГ или Латиница
        const matches = medicationsList.filter(m => {
          const bgMatch = m.name_bg && m.name_bg.toLowerCase().startsWith(query);
          const latinMatch = m.name_latin && m.name_latin.toLowerCase().startsWith(query);
          return bgMatch || latinMatch;
        });

        if (matches.length === 0) {
          suggestions.innerHTML = '<div class="suggestion-item" style="color: #a0aec0;">Няма намерени лекарства</div>';
          return;
        }

        matches.forEach(m => {
          const item = document.createElement('div');
          item.className = 'suggestion-item';
          item.textContent = m.name_latin ? `${m.name_bg} (${m.name_latin})` : m.name_bg;
          
          item.addEventListener('click', () => {
            input.value = m.name_bg;
            hiddenInput.value = m.id;
            suggestions.innerHTML = '';
          });

          suggestions.appendChild(item);
        });
      });

      // Затваряне при клик извън компонента
      document.addEventListener('click', (e) => {
        if (e.target !== input && !suggestions.contains(e.target)) {
          suggestions.innerHTML = '';
        }
      });
    }

    // Запис на покупка
    async function handlePurchaseSubmit(e) {
      e.preventDefault();
      const medication_id = document.getElementById('selected-medication-id').value;
      
      if (!medication_id) {
        alert("Моля, изберете валидно лекарство от падащото меню!");
        return;
      }

      const payload = {
        medication_id: medication_id,
        pharmacy_id: document.getElementById('pharmacy-id').value || null,
        purchase_date: document.getElementById('purchase-date').value,
        price_eur: parseFloat(document.getElementById('price-eur').value),
        price_zk_eur: document.getElementById('price-zk-eur').value ? parseFloat(document.getElementById('price-zk-eur').value) : null,
        notes: document.getElementById('purchase-notes').value || null
      };

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/purchases`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          alert('Покупката е записана успешно!');
          document.getElementById('purchase-form').reset();
          document.getElementById('purchase-date').valueAsDate = new Date();
          fetchPurchases();
        } else {
          alert('Грешка при запис.');
        }
      } catch (err) {
        console.error("Грешка:", err);
      }
    }

    // Извличане на история на покупките
    async function fetchPurchases() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/purchases?select=id,purchase_date,price_eur,price_zk_eur,medications(name_bg)&order=purchase_date.desc&limit=5`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const data = await response.json();
        const tbody = document.getElementById('purchases-list');
        tbody.innerHTML = data.map(p => `
          <tr>
            <td>${p.medications ? p.medications.name_bg : 'Неизвестно'}</td>
            <td>${p.purchase_date}</td>
            <td>${p.price_eur} €</td>
            <td>${p.price_zk_eur ? p.price_zk_eur + ' €' : '-'}</td>
          </tr>
        `).join('');
      } catch (err) {
        console.error("Грешка при извличане на покупки:", err);
      }
    }

    // Инициализация при зареждане
    window.onload = initData;
  </script>
</body>
</html>
