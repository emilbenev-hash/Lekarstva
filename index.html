                <div class="form-row">
                    <div class="form-group"><label><input type="checkbox" id="health_insurance" ${m.health_insurance?'checked':''}> ЗОК</label></div>
                    <div class="form-group"><label><input type="checkbox" id="is_active" ${m.is_active?'checked':''}> Активно</label></div>
                    <div class="form-group"><label><input type="checkbox" id="is_daily" ${m.is_daily?'checked':''}> Ежедневно</label></div>
                    <div class="form-group"><label><input type="checkbox" id="is_emergency" ${m.is_emergency?'checked':''}> Спешно</label></div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Аптека (нова покупка)</label>
                        <input type="text" id="pharmacy_name" list="pharmacies_list" value="${pharmNameVal}" placeholder="Аптека...">
                        <datalist id="pharmacies_list">${pharmDatalist}</datalist>
                    </div>
                    <div class="form-group">
                        <label>Дата на покупка</label>
                        <input type="text" id="purchase_date" value="${formatDateToBG(todayStr)}" placeholder="дд.мм.гггг">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group"><label>Стандартна цена (EUR)</label><input type="number" step="0.01" id="price_eur" value="${pEur}"></div>
                    <div class="form-group"><label>Цена по ЗОК (EUR)</label><input type="number" step="0.01" id="price_zk_eur" value="${pZk}"></div>
                </div>

                <div class="form-group" style="background: #F7FAFC; padding: 10px; border: 1px solid #CBD5E0; border-radius: 6px;">
                    <label style="color: #2B6CB0; font-weight: bold;">📊 История на цените (кликни ✏️ за редакция):</label>
                    ${purchasesHistoryHtml}
                </div>

                <div class="form-group"><label>Бележки</label><textarea id="notes">${m.notes||''}</textarea></div>
                <div class="form-group"><label>Описание</label><textarea id="desc">${m.description||''}</textarea></div>`;
            
            if(availableDocs.length > 0) {
                const sel = document.getElementById('existing_doc_select');
                if(sel) sel.innerHTML = existingDocOpts;
            }

            document.getElementById('editPanel').style.display = 'block';
        }

        function openZokCalculator() {
            document.getElementById('zokCalculatorModal').style.display = 'flex';
            document.getElementById('calcTotalPaid').value = '';
            
            let medOptions = '';
            state.meds.forEach(m => {
                let displayName = m.name_bg || m.name_latin || 'Без име';
                if (m.volume_quantity) displayName += ` ${m.volume_quantity}`;
                if (m.volume_unit) displayName += ` ${m.volume_unit}`;
                medOptions += `<option value="${displayName}">`;
            });
            document.getElementById('zokMedDatalist').innerHTML = medOptions;

            document.getElementById('calcMedicationsTableBody').innerHTML = '';
            addZokCalcRow();
        }

        function closeZokCalculator() {
            document.getElementById('zokCalculatorModal').style.display = 'none';
        }

        function addZokCalcRow() {
            const tbody = document.getElementById('calcMedicationsTableBody');
            const tr = document.createElement('tr');
            tr.style.borderBottom = '1px solid #eee';
            tr.innerHTML = `
                <td style="padding:6px;">
                    <input type="text" list="zokMedDatalist" class="calc-med-input" style="width:100%; padding:6px; border:1px solid #ccc; border-radius:4px;" placeholder="Търси лекарство..." oninput="onCalcMedInput(this)" onchange="onCalcMedInput(this)">
                </td>
                <td style="padding:6px;"><input type="number" step="0.01" class="calc-std-price" style="width:100%; padding:6px; border:1px solid #ccc; border-radius:4px;" placeholder="0.00"></td>
                <td style="padding:6px; font-weight:bold; color:#E74C3C;" class="calc-result-zk">-</td>
                <td style="padding:6px; text-align:center;"><button type="button" onclick="this.closest('tr').remove()" style="background:#E74C3C; color:white; border:none; padding:4px 6px; border-radius:4px; cursor:pointer;" title="Премахни">X</button></td>
            `;
            tbody.appendChild(tr);
        }

        function onCalcMedInput(inputElement) {
            const val = inputElement.value.trim().toLowerCase();
            const tr = inputElement.closest('tr');
            const stdPriceInput = tr.querySelector('.calc-std-price');

            if (!val) {
                stdPriceInput.value = '';
                return;
            }

            const matchedMed = state.meds.find(m => {
                let displayName = m.name_bg || m.name_latin || '';
                if (m.volume_quantity) displayName += ` ${m.volume_quantity}`;
                if (m.volume_unit) displayName += ` ${m.volume_unit}`;
                return displayName.toLowerCase() === val || (m.name_bg && m.name_bg.toLowerCase() === val);
            });

            if (matchedMed) {
                const medPurchases = state.purchases.filter(p => String(p.medication_id) === String(matchedMed.id));
                if (medPurchases.length > 0) {
                    medPurchases.sort((a, b) => {
                        const dateA = a.purchase_date ? new Date(a.purchase_date) : new Date(0);
                        const dateB = b.purchase_date ? new Date(b.purchase_date) : new Date(0);
                        if (dateB - dateA !== 0) return dateB - dateA;
                        return (b.id || 0) - (a.id || 0);
                    });
                    const validStd = medPurchases.find(p => p.price_eur !== null && p.price_eur !== undefined);
                    stdPriceInput.value = validStd ? validStd.price_eur.toFixed(2) : '';
                } else {
                    stdPriceInput.value = '';
                }
            }
        }

        function calculateZokDistribution() {
            const totalPaidInput = parseFloat(document.getElementById('calcTotalPaid').value);
            if (isNaN(totalPaidInput) || totalPaidInput <= 0) {
                alert('Моля, въведете валидна обща платена сума по ЗОК!');
                return;
            }

            const rows = document.querySelectorAll('#calcMedicationsTableBody tr');
            if (rows.length === 0) {
                alert('Моля, добавете поне едно лекарство!');
                return;
            }

            let totalStandard = 0;
            const itemsToCalc = [];

            rows.forEach(tr => {
                const inputVal = tr.querySelector('.calc-med-input').value.trim();
                const stdInput = tr.querySelector('.calc-std-price');
                const resultCell = tr.querySelector('.calc-result-zk');
                
                if (inputVal !== '') {
                    const stdPrice = parseFloat(stdInput.value);
                    if (!isNaN(stdPrice) && stdPrice > 0) {
                        totalStandard += stdPrice;
                        itemsToCalc.push({ resultCell, stdPrice });
                    }
                }
            });

            if (itemsToCalc.length === 0) {
                alert('Моля, въведете валидни лекарства и стандартни цени > 0!');
                return;
            }

            if (totalStandard <= 0) {
                alert('Общата стандартна цена трябва да е по-голяма от 0!');
                return;
            }

            const k = totalPaidInput / totalStandard;

            itemsToCalc.forEach(item => {
                const zokPrice = item.stdPrice * k;
                item.resultCell.innerText = zokPrice.toFixed(2) + ' €';
            });
        }

        async function linkExistingDoc() {
            const sel = document.getElementById('existing_doc_select');
            if(!sel) return;
            const docId = sel.value;
            if (!docId) return;
            const h = { 'apikey': CONFIG.KEY, 'Authorization': 'Bearer ' + CONFIG.KEY, 'Content-Type': 'application/json' };
            
            const res = await fetch(`${CONFIG.URL}/rest/v1/medication_documents`, {
                method: 'POST',
                headers: h,
                body: JSON.stringify({ medication_id: state.currentId, document_id: docId })
            });

            if (res.ok) {
                state.medication_documents.push({ medication_id: state.currentId, document_id: docId });
                openPanel(state.currentId);
                renderUI();
            }
        }

        async function unlinkDocument(docId) {
            const h = { 'apikey': CONFIG.KEY, 'Authorization': 'Bearer ' + CONFIG.KEY };
            await fetch(`${CONFIG.URL}/rest/v1/medication_documents?medication_id=eq.${state.currentId}&document_id=eq.${docId}`, {
                method: 'DELETE',
                headers: h
            });
            state.medication_documents = state.medication_documents.filter(md => !(String(md.medication_id) === String(state.currentId) && String(md.document_id) === String(docId)));
            openPanel(state.currentId);
            renderUI();
        }

        async function saveMed() {
            const h = { 'apikey': CONFIG.KEY, 'Authorization': 'Bearer ' + CONFIG.KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

            const volValue = document.getElementById('vol').value.trim();
            const fileInput = document.getElementById('new_doc_file');

            if (fileInput && fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const cleanFileName = `doc_${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${file.name.split('.').pop()}`;
                
                const uploadRes = await fetch(`${CONFIG.URL}/storage/v1/object/medical-docs/${cleanFileName}`, {
                    method: 'POST',
                    headers: {
                        'apikey': CONFIG.KEY,
                        'Authorization': 'Bearer ' + CONFIG.KEY,
                        'Content-Type': file.type
                    },
                    body: file
                });

                if (uploadRes.ok) {
                    const publicUrl = `${CONFIG.URL}/storage/v1/object/public/medical-docs/${cleanFileName}`;
                    
                    const newDocRes = await fetch(`${CONFIG.URL}/rest/v1/documents`, {
                        method: 'POST',
                        headers: h,
                        body: JSON.stringify({ file_url: publicUrl, file_name: file.name })
                    });
                    const newDocData = await newDocRes.json();
                    
                    if (newDocData && newDocData.length > 0) {
                        const createdDoc = newDocData[0];
                        state.documents.push(createdDoc);

                        await fetch(`${CONFIG.URL}/rest/v1/medication_documents`, {
                            method: 'POST',
                            headers: h,
                            body: JSON.stringify({ medication_id: state.currentId, document_id: createdDoc.id })
                        });
                        state.medication_documents.push({ medication_id: state.currentId, document_id: createdDoc.id });
                    }
                } else {
                    const errText = await uploadRes.text();
                    alert("Грешка при качване в Storage: " + errText);
                    return;
                }
            }

            const catInputName = document.getElementById('category_name').value.trim();
            let categoryId = null;
            if (catInputName !== '') {
                let existingCat = state.categories.find(c => c.name.toLowerCase() === catInputName.toLowerCase());
                if (existingCat) {
                    categoryId = existingCat.id;
                } else {
                    const newCatRes = await fetch(`${CONFIG.URL}/rest/v1/categories`, {
                        method: 'POST',
                        headers: h,
                        body: JSON.stringify({ name: catInputName })
                    });
                    const newCatData = await newCatRes.json();
                    if (newCatData && newCatData.length > 0) {
                        categoryId = newCatData[0].id;
                        state.categories.push(newCatData[0]);
                    }
                }
            }

            const docInputName = document.getElementById('doctor_name').value.trim();
            let doctorId = null;
            if (docInputName !== '') {
                let existingDoc = state.doctors.find(d => d.name.toLowerCase() === docInputName.toLowerCase());
                if (existingDoc) {
                    doctorId = existingDoc.id;
                } else {
                    const newDocRes = await fetch(`${CONFIG.URL}/rest/v1/doctors`, {
                        method: 'POST',
                        headers: h,
                        body: JSON.stringify({ name: docInputName })
                    });
                    const newDocData = await newDocRes.json();
                    if (newDocData && newDocData.length > 0) {
                        doctorId = newDocData[0].id;
                        state.doctors.push(newDocData[0]);
                    }
                }
            }

            const mcInputName = document.getElementById('medical_center_name').value.trim();
            let mcId = null;
            if (mcInputName !== '') {
                let existingMc = state.medicalCenters.find(c => c.name.toLowerCase() === mcInputName.toLowerCase());
                if (existingMc) {
                    mcId = existingMc.id;
                } else {
                    const newMcRes = await fetch(`${CONFIG.URL}/rest/v1/medical_centers`, {
                        method: 'POST',
                        headers: h,
                        body: JSON.stringify({ name: mcInputName })
                    });
                    const newMcData = await newMcRes.json();
                    if (newMcData && newMcData.length > 0) {
                        mcId = newMcData[0].id;
                        state.medicalCenters.push(newMcData[0]);
                    }
                }
            }

            const manInputName = document.getElementById('manufacturer_name').value.trim();
            let manufacturerId = null;
            if (manInputName !== '') {
                let existingMan = state.manufacturers.find(mn => mn.name.toLowerCase() === manInputName.toLowerCase());
                if (existingMan) {
                    manufacturerId = existingMan.id;
                } else {
                    const newManRes = await fetch(`${CONFIG.URL}/rest/v1/manufacturers`, {
                        method: 'POST',
                        headers: h,
                        body: JSON.stringify({ name: manInputName })
                    });
                    const newManData = await newManRes.json();
                    if (newManData && newManData.length > 0) {
                        manufacturerId = newManData[0].id;
                        state.manufacturers.push(newManData[0]);
                    }
                }
            }

            const pDateEl = document.getElementById('prescription_date');
            const prescriptionDateVal = pDateEl && pDateEl.value ? parseDateToISO(pDateEl.value) : null;

            const medUpdates = {
                name_bg: document.getElementById('name_bg').value,
                name_latin: document.getElementById('name_latin').value,
                active_substance: document.getElementById('active').value,
                category_id: categoryId,
                manufacturer_id: manufacturerId,
                volume_quantity: volValue !== '' ? volValue : null,
                volume_unit: document.getElementById('unit').value,
                form: document.getElementById('form').value,
                form_quantity: parseInt(document.getElementById('qty').value) || null,
                dosage: document.getElementById('dosage').value,
                doctor_id: doctorId,
                prescription_medical_center_id: mcId,
                prescription_date: prescriptionDateVal,
                health_insurance: document.getElementById('health_insurance').checked,
                is_active: document.getElementById('is_active').checked,
                is_daily: document.getElementById('is_daily').checked,
                is_emergency: document.getElementById('is_emergency').checked,
                notes: document.getElementById('notes').value,
                description: document.getElementById('desc').value
            };

            await fetch(`${CONFIG.URL}/rest/v1/medications?id=eq.${state.currentId}`, {
                method: 'PATCH',
                headers: h,
                body: JSON.stringify(medUpdates)
            });

            await fetch(`${CONFIG.URL}/rest/v1/medication_persons?medication_id=eq.${state.currentId}`, {
                method: 'DELETE',
                headers: h
            });

            const selectedPersons = Array.from(document.querySelectorAll('input[name="person_checkbox"]:checked')).map(cb => cb.value);
            for (let personId of selectedPersons) {
                await fetch(`${CONFIG.URL}/rest/v1/medication_persons`, {
                    method: 'POST',
                    headers: h,
                    body: JSON.stringify({ medication_id: state.currentId, person_id: personId })
                });
            }

            const priceEurVal = document.getElementById('price_eur').value;
            const priceZkVal = document.getElementById('price_zk_eur').value;
            const pharmNameInput = document.getElementById('pharmacy_name').value.trim();

            const pEur = priceEurVal !== '' ? parseFloat(priceEurVal) : 0;
            const pZk = priceZkVal !== '' ? parseFloat(priceZkVal) : 0;
            
            let pharmId = null;
            if (pharmNameInput !== '') {
                let existingPharm = state.pharmacies.find(p => p.name.toLowerCase() === pharmNameInput.toLowerCase());
                if (existingPharm) {
                    pharmId = existingPharm.id;
                } else {
                    const newPharmRes = await fetch(`${CONFIG.URL}/rest/v1/pharmacies`, {
                        method: 'POST',
                        headers: h,
                        body: JSON.stringify({ name: pharmNameInput })
                    });
                    const newPharmData = await newPharmRes.json();
                    if (newPharmData && newPharmData.length > 0) {
                        pharmId = newPharmData[0].id;
                        state.pharmacies.push(newPharmData[0]);
                    }
                }
            }

            if (priceEurVal !== '' || priceZkVal !== '' || pharmNameInput !== '') {
                const purchDateEl = document.getElementById('purchase_date');
                const pDateVal = purchDateEl && purchDateEl.value ? purchDateEl.value : '';
                const pDate = pDateVal ? parseDateToISO(pDateVal) : new Date().toISOString().split('T')[0];
                
                if (state.editingPurchaseId) {
                    await fetch(`${CONFIG.URL}/rest/v1/purchases?id=eq.${state.editingPurchaseId}`, {
                        method: 'PATCH',
                        headers: h,
                        body: JSON.stringify({ 
                            price_eur: pEur, 
                            price_zk_eur: pZk, 
                            pharmacy_id: pharmId, 
                            purchase_date: pDate 
                        })
                    });
                    state.editingPurchaseId = null;
                } else {
                    await fetch(`${CONFIG.URL}/rest/v1/purchases`, {
                        method: 'POST',
                        headers: h,
                        body: JSON.stringify({ 
                            medication_id: state.currentId, 
                            price_eur: pEur, 
                            price_zk_eur: pZk, 
                            pharmacy_id: pharmId, 
                            purchase_date: pDate 
                        })
                    });
                }
            }

            document.getElementById('editPanel').style.display = 'none';
            refreshData();
        }

        function openFullscreen(url, title) {
            document.getElementById('fsTitle').innerText = "Документ: " + title;
            document.getElementById('fsContainer').innerHTML = `<iframe src="${url}" style="width:100%; height:100%; border:none;"></iframe>`;
            document.getElementById('fullscreenModal').style.display = 'flex';
        }

        function closeFullscreen() {
            document.getElementById('fullscreenModal').style.display = 'none';
            document.getElementById('fsContainer').innerHTML = '';
        }
        
        window.onload = refreshData;
    </script>
