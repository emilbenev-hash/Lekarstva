<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Здравно приложение - Скенер на бонове</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- jsQR библиотека за разчитане на QR кодове директно в браузъра -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin: 20px 0; }
        .btn { background-color: #3498db; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; transition: background 0.3s; flex: 1; text-align: center; }
        .btn:hover { background-color: #2980b9; }
        .btn-success { background-color: #2ecc71; }
        .btn-success:hover { background-color: #27ae60; }
        input[type="file"] { display: none; }
        #status { text-align: center; font-weight: bold; margin-top: 15px; color: #e67e22; }
        #log { margin-top: 20px; font-size: 14px; background: #ecf0f1; padding: 10px; border-radius: 6px; max-height: 180px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Скенер на фискални бонове</h2>
        
        <div class="btn-group">
            <button class="btn btn-success" onclick="document.getElementById('cameraInput').click()">Снимай бон</button>
            <button class="btn" onclick="document.getElementById('galleryInput').click()">Избери от галерия</button>
        </div>

        <!-- Полета за камера и галерия (снимката се записва автоматично в устройството/галерията) -->
        <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleReceiptFile(event)">
        <input type="file" id="galleryInput" accept="image/*" onchange="handleReceiptFile(event)">

        <div id="status">Готово за сканиране</div>
        <div id="log"></div>
    </div>

    <script>
        // Инициализация на Supabase (заменете с вашите реални ключове)
        const SUPABASE_URL = 'ВАШИЯТ_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'ВАШИЯТ_SUPABASE_ANON_KEY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function logMessage(msg) {
            const logEl = document.getElementById('log');
            logEl.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function handleReceiptFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusEl = document.getElementById('status');
            statusEl.innerText = "Обработка на изображението...";
            logMessage(`Зареден файл: ${file.name}`);

            try {
                // 1. Зареждане на снимката в паметта и анализ на QR кода чрез jsQR
                const qrData = await readQRCodeFromImage(file);
                
                let parsedData = {
                    medicineName: "Панразол табл. 40мг х30", // Може да се промени или допълни
                    priceEur: 30.44,
                    date: new Date().toISOString().split('T')[0],
                    pharmacyName: "Аптека"
                };

                if (qrData) {
                    logMessage("QR кодът е разчетен успешно!");
                    const extractedFromQR = parseQRUrl(qrData);
                    if (extractedFromQR.priceEur) parsedData.priceEur = extractedFromQR.priceEur;
                    if (extractedFromQR.date) parsedData.date = extractedFromQR.date;
                } else {
                    logMessage("QR кодът не беше открит, използват се стандартни стойности.");
                }

                logMessage(`Данни за запис -> Лекарство: ${parsedData.medicineName} | Цена: ${parsedData.priceEur} EUR | Дата: ${parsedData.date}`);

                // 2. Запис или проверка за дубликат в Supabase
                await saveToDatabase(parsedData);
                statusEl.innerText = "Готово! Данните са в базата.";
            } catch (err) {
                console.error(err);
                statusEl.innerText = "Възникна грешка.";
                logMessage(`Грешка: ${err.message}`);
            } finally {
                event.target.value = '';
            }
        }

        // Функция за разчитане на QR код от файл чрез Canvas и jsQR
        async function readQRCodeFromImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);
                        
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height);
                        
                        if (code) {
                            resolve(code.data);
                        } else {
                            resolve(null);
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // Извличане на параметри от линка в QR кода на НАП
        function parseQRUrl(url) {
            let result = {};
            try {
                const urlParams = new URLSearchParams(url.split('?')[1] || url);
                // В QR кодовете на НАП сумата обикновено е под параметър 'm', а датата под 'dt'
                const m = urlParams.get('m');
                if (m) result.priceEur = parseFloat(m);

                const dt = urlParams.get('dt');
                if (dt) {
                    // Формат обикновено ДД.ММ.ГГГГ или подобен
                    const cleanDt = dt.split('_')[0].replace(/\./g, '-');
                    const parts = cleanDt.split('-');
                    if (parts.length === 3) {
                        result.date = `${parts[2]}-${parts[1]}-${parts[0]}`;
                    }
                }
            } catch (e) {
                console.log("Грешка при парсване на QR линка:", e);
            }
            return result;
        }

        async function saveToDatabase(parsed) {
            // 1. Проверка или създаване на аптека в таблица 'pharmacies'
            let { data: pharmacyData } = await supabase
                .from('pharmacies')
                .select('id')
                .ilike('name', `%${parsed.pharmacyName}%`)
                .limit(1);

            let pharmacyId = null;
            if (pharmacyData && pharmacyData.length > 0) {
                pharmacyId = pharmacyData[0].id;
            } else {
                let { data: newPharm, error: pErr } = await supabase
                    .from('pharmacies')
                    .insert([{ name: parsed.pharmacyName }])
                    .select('id')
                    .single();
                if (!pErr && newPharm) pharmacyId = newPharm.id;
            }

            // 2. Проверка или създаване на лекарство в таблица 'medications'
            let { data: medData } = await supabase
                .from('medications')
                .select('id')
                .ilike('name_bg', `%${parsed.medicineName}%`)
                .limit(1);

            let medicationId = null;
            if (medData && medData.length > 0) {
                medicationId = medData[0].id;
            } else {
                let { data: newMed, error: mErr } = await supabase
                    .from('medications')
                    .insert([{ name_bg: parsed.medicineName, is_active: true }])
                    .select('id')
                    .single();
                if (!mErr && newMed) medicationId = newMed.id;
            }

            if (!medicationId) {
                throw new Error("Неуспешно намиране или създаване на лекарство в базата.");
            }

            // 3. Проверка за дублиране в таблица 'purchases'
            let { data: existingPurchases } = await supabase
                .from('purchases')
                .select('id, price_eur')
                .eq('medication_id', medicationId)
                .eq('purchase_date', parsed.date);

            if (existingPurchases && existingPurchases.length > 0) {
                const existing = existingPurchases[0];
                const overwrite = confirm(`Намерен е съществуващ запис за "${parsed.medicineName}" на дата ${parsed.date} с цена ${existing.price_eur} EUR.\n\nЖелаете ли да презапишете записа?\n(Натиснете "Отказ", за да го пропуснете)`);
                
                if (!overwrite) {
                    logMessage("Записът беше отменен поради дублиране.");
                    return;
                }

                let { error: updateErr } = await supabase
                    .from('purchases')
                    .update({
                        price_eur: parsed.priceEur,
                        pharmacy_id: pharmacyId,
                        notes: 'Презаписано чрез QR сканиране на бон'
                    })
                    .eq('id', existing.id);

                if (updateErr) throw updateErr;
                logMessage("Съществуващият запис е презаписан успешно.");
            } else {
                let { error: insertErr } = await supabase
                    .from('purchases')
                    .insert([{
                        medication_id: medicationId,
                        pharmacy_id: pharmacyId,
                        purchase_date: parsed.date,
                        price_eur: parsed.priceEur,
                        notes: 'Добавено чрез QR сканиране на бон'
                    }]);

                if (insertErr) throw insertErr;
                logMessage("Новият запис е добавен успешно в базата.");
            }
        }
    </script>
</body>
</html>
