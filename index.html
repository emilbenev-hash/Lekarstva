<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Здравно приложение - Скенер на бонове</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Tesseract.js OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin: 20px 0; }
        .btn { background-color: #3498db; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; transition: background 0.3s; flex: 1; text-align: center; }
        .btn:hover { background-color: #2980b9; }
        .btn-success { background-color: #2ecc71; }
        .btn-success:hover { background-color: #27ae60; }
        input[type="file"] { display: none; }
        #status { text-align: center; font-weight: bold; margin-top: 15px; color: #e67e22; }
        #log { margin-top: 20px; font-size: 14px; background: #ecf0f1; padding: 10px; border-radius: 6px; max-height: 180px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Скенер на фискални бонове</h2>
        
        <div class="btn-group">
            <button class="btn btn-success" onclick="document.getElementById('cameraInput').click()">Снимай бон</button>
            <button class="btn" onclick="document.getElementById('galleryInput').click()">Избери от галерия</button>
        </div>

        <!-- Скрити полета за камера и галерия -->
        <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleReceipt(event)">
        <input type="file" id="galleryInput" accept="image/*" onchange="handleReceipt(event)">

        <div id="status">Готово за сканиране</div>
        <div id="log"></div>
    </div>

    <script>
        // Инициализация на Supabase (заменете с вашите реални ключове)
        const SUPABASE_URL = 'ВАШИЯТ_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'ВАШИЯТ_SUPABASE_ANON_KEY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function logMessage(msg) {
            const logEl = document.getElementById('log');
            logEl.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function handleReceipt(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusEl = document.getElementById('status');
            statusEl.innerText = "Разпознаване на текста (OCR)...";
            logMessage(`Файлът е зареден: ${file.name}`);

            try {
                // Използване на Tesseract.js директно в браузъра за български и английски
                const { data: { text } } = await Tesseract.recognize(file, 'bul+eng', {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            statusEl.innerText = `OCR: ${Math.round(m.progress * 100)}%`;
                        }
                    }
                });

                logMessage("Текстът от бона е разпознат успешно.");
                statusEl.innerText = "Анализиране на данните...";

                const parsed = parseReceiptText(text);
                logMessage(`Открито: ${parsed.medicineName} | Цена: ${parsed.priceEur} EUR | Дата: ${parsed.date}`);

                await saveToDatabase(parsed);
                statusEl.innerText = "Готово! Данните са записани.";
            } catch (err) {
                console.error(err);
                statusEl.innerText = "Грешка при обработката.";
                logMessage(`Грешка: ${err.message}`);
            } finally {
                event.target.value = ''; // Изчистване на input полето
            }
        }

        function parseReceiptText(text) {
            let medicineName = "Неизвестно лекарство";
            let priceEur = 0.00;
            let date = new Date().toISOString().split('T')[0];
            let pharmacyName = "Аптека";

            const lines = text.split('\n');
            for (let line of lines) {
                const upper = line.toUpperCase();
                if (upper.includes("ТАБЛ") || upper.includes("КАПС") || upper.includes("АНРАЗОЛ") || upper.includes("ПАНРАЗОЛ")) {
                    medicineName = line.trim();
                }
            }

            // Търсене на сума в евро
            const eurMatches = text.match(/\d+[.,]\d{2}/g);
            if (eurMatches && eurMatches.length > 0) {
                priceEur = parseFloat(eurMatches[eurMatches.length - 1].replace(',', '.'));
            }

            // Търсене на дата във формат ДД-ММ-ГГГГ или ДД.ММ.ГГГГ
            const dateMatch = text.match(/\d{2}[-.]\d{2}[-.]\d{4}/);
            if (dateMatch) {
                let clean = dateMatch[0].replace(/\./g, '-');
                const parts = clean.split('-');
                if (parts.length === 3) {
                    date = `${parts[2]}-${parts[1]}-${parts[0]}`;
                }
            }

            return { medicineName, priceEur, date, pharmacyName };
        }

        async function saveToDatabase(parsed) {
            // 1. Проверка или създаване на аптека
            let { data: pharmacyData } = await supabase
                .from('pharmacies')
                .select('id')
                .ilike('name', `%${parsed.pharmacyName}%`)
                .limit(1);

            let pharmacyId = null;
            if (pharmacyData && pharmacyData.length > 0) {
                pharmacyId = pharmacyData[0].id;
            } else {
                let { data: newPharm, error: pErr } = await supabase
                    .from('pharmacies')
                    .insert([{ name: parsed.pharmacyName }])
                    .select('id')
                    .single();
                if (!pErr && newPharm) pharmacyId = newPharm.id;
            }

            // 2. Проверка или създаване на лекарство в таблицата medications
            let { data: medData } = await supabase
                .from('medications')
                .select('id')
                .ilike('name_bg', `%${parsed.medicineName}%`)
                .limit(1);

            let medicationId = null;
            if (medData && medData.length > 0) {
                medicationId = medData[0].id;
            } else {
                let { data: newMed, error: mErr } = await supabase
                    .from('medications')
                    .insert([{ name_bg: parsed.medicineName, is_active: true }])
                    .select('id')
                    .single();
                if (!mErr && newMed) medicationId = newMed.id;
            }

            if (!medicationId) {
                throw new Error("Неуспешно намиране или създаване на лекарство в базата.");
            }

            // 3. Проверка за дублиране в таблицата purchases
            let { data: existingPurchases, error: dupErr } = await supabase
                .from('purchases')
                .select('id, price_eur')
                .eq('medication_id', medicationId)
                .eq('purchase_date', parsed.date);

            if (existingPurchases && existingPurchases.length > 0) {
                const existing = existingPurchases[0];
                const overwrite = confirm(`Намерен е съществуващ запис за "${parsed.medicineName}" на дата ${parsed.date} с цена ${existing.price_eur} EUR.\n\nЖелаете ли да презапишете записа?\n(Натиснете "Отказ", за да го пропуснете)`);
                
                if (!overwrite) {
                    logMessage("Записът беше отменен от потребителя поради дублиране.");
                    return;
                }

                // Презаписване (Update) на съществуващия запис
                let { error: updateErr } = await supabase
                    .from('purchases')
                    .update({
                        price_eur: parsed.priceEur,
                        pharmacy_id: pharmacyId,
                        notes: 'Презаписано чрез сканиране на бон'
                    })
                    .eq('id', existing.id);

                if (updateErr) throw updateErr;
                logMessage("Съществуващият запис беше презаписан успешно.");
            } else {
                // Нов запис (Insert)
                let { error: insertErr } = await supabase
                    .from('purchases')
                    .insert([{
                        medication_id: medicationId,
                        pharmacy_id: pharmacyId,
                        purchase_date: parsed.date,
                        price_eur: parsed.priceEur,
                        notes: 'Добавено чрез сканиране на бон'
                    }]);

                if (insertErr) throw insertErr;
                logMessage("Новият запис е добавен успешно в базата.");
            }
        }
    </script>
</body>
</html>
